#cloud-config
package_update: true
package_upgrade: false
packages: [docker.io, git, curl, ffmpeg]

groups: [docker]
users:
  - default
  - name: testpress
    gecos: Testpress application user
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
ssh_pwauth: false

write_files:
  # Explicit string tags survive Multipass 1.15 YAML serialization.
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: !!str 0640
    content: |
      APP_ENV=development
      APP_PORT=8080
      MESSAGE=Hello from Testpress!

  - path: /opt/testpress/server.py
    owner: root:root
    permissions: !!str 0644
    content: |
      import os
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/":
                  status, body = 200, os.environ["MESSAGE"].encode()
              elif self.path == "/health":
                  status, body = 200, b"ok"
              else:
                  status, body = 404, b"Not found"
              self.send_response(status)
              self.send_header("Content-Type", "text/plain; charset=utf-8")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

      ThreadingHTTPServer(("0.0.0.0", int(os.environ["APP_PORT"])), Handler).serve_forever()

  - path: /opt/testpress/Dockerfile
    owner: root:root
    permissions: !!str 0644
    content: |
      FROM python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
      WORKDIR /app
      COPY server.py .
      USER 10001:10001
      EXPOSE 8080
      HEALTHCHECK --interval=5s --timeout=3s --start-period=5s --retries=3 CMD python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read() == b'ok'"
      CMD ["python", "-u", "server.py"]

  - path: /etc/systemd/system/testpress.service
    owner: root:root
    permissions: !!str 0644
    content: |
      [Unit]
      Description=Testpress HTTP application
      Requires=docker.service
      After=docker.service
      StartLimitIntervalSec=60
      StartLimitBurst=10

      [Service]
      Type=simple
      Restart=always
      RestartSec=3
      TimeoutStartSec=60
      TimeoutStopSec=30
      ExecStartPre=-/usr/bin/docker rm -f testpress-app
      ExecStart=/usr/bin/docker run --name testpress-app --restart=no --init --read-only --cap-drop=ALL --security-opt=no-new-privileges --log-opt=max-size=10m --log-opt=max-file=3 --env-file=/opt/testpress/app.env --publish=8080:8080 testpress-app:1
      ExecStop=/usr/bin/docker stop --time=10 testpress-app

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/provision-testpress
    owner: root:root
    permissions: !!str 0755
    content: |
      #!/bin/bash
      set -euo pipefail
      install -d -o root -g testpress -m 0750 /opt/testpress
      chown root:testpress /opt/testpress/app.env
      chmod 0640 /opt/testpress/app.env
      systemctl enable --now docker
      # The image ID stays the same for unchanged build inputs (Docker layer cache).
      docker build --tag testpress-app:1 /opt/testpress
      systemctl daemon-reload
      systemctl enable testpress.service
      systemctl start testpress.service
      for attempt in {1..60}; do
        if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/health; then
          printf '\nTestpress provisioning complete\n'
          exit 0
        fi
        sleep 2
      done
      journalctl -u testpress.service --no-pager -n 50
      exit 1

runcmd:
  - [bash, -e, -u, -o, pipefail, -c, /usr/local/sbin/provision-testpress]
